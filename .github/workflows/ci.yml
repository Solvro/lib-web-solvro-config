name: CI

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build
        run: npm run build

      - name: Run commitlint check
        if: always()
        run: npx commitlint -f ${{ github.event.pull_request.base.sha }}

      - name: Run ESLint check
        if: always()
        run: npm run lint

      - name: Run Prettier check
        if: always()
        run: npm run format

      - name: Check types
        if: always()
        run: npm run typecheck

      - name: Check dead code
        if: always()
        run: npm run knip

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        package-manager: [npm, pnpm]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Set up pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: npm ci

      - name: Install create-next-app globally (npm)
        if: matrix.package-manager == 'npm'
        run: npx -y create-next-app@latest --version

      - name: Install create-next-app globally (pnpm)
        if: matrix.package-manager == 'pnpm'
        run: pnpm dlx create-next-app@latest --version

      - name: Run Vitest integration tests
        run: npm test
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
